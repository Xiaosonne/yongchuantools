<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YongChuanTools 仪表盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
  header { background: #1a2533; padding: 16px 24px; border-bottom: 1px solid #2a3a4a; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; color: #00d4ff; }
  header .subtitle { color: #7a8a9a; font-size: 13px; }
  .status-bar { display: flex; gap: 24px; padding: 16px 24px; background: #1a2533; border-bottom: 1px solid #2a3a4a; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 11px; color: #7a8a9a; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #00d4ff; }
  .stat-value.warning { color: #ffaa00; }
  .stat-value.danger { color: #ff4d4d; }
  .stat-value.success { color: #00cc88; }
  .main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px 24px; height: calc(100vh - 120px); }
  .panel { background: #1a2533; border-radius: 8px; border: 1px solid #2a3a4a; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid #2a3a4a; font-size: 13px; font-weight: 600; color: #7a8a9a; display: flex; align-items: center; gap: 8px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px; }
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-thumb { background: #3a4a5a; border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; color: #7a8a9a; font-weight: 500; border-bottom: 1px solid #2a3a4a; position: sticky; top: 0; background: #1a2533; }
  td { padding: 8px; border-bottom: 1px solid #1e2a38; }
  tr:hover td { background: #1e2a38; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .tag-normal { background: #0d3320; color: #00cc88; }
  .tag-alarm { background: #330d0d; color: #ff4d4d; }
  .tag-fault { background: #332800; color: #ffaa00; }
  .tag-shield { background: #1a1a33; color: #8888ff; }
  .tag-unknown { background: #1a1a1a; color: #7a8a9a; }
  .event-list { display: flex; flex-direction: column; gap: 6px; }
  .event { padding: 10px 12px; background: #1e2a38; border-radius: 6px; border-left: 3px solid #2a3a4a; font-size: 12px; }
  .event-time { color: #7a8a9a; font-size: 11px; margin-bottom: 3px; }
  .event-equip { color: #00d4ff; font-weight: 500; }
  .event-sys { color: #bb88ff; }
  .event-session { color: #7a8a9a; font-size: 11px; }
  .event-detail { margin-top: 4px; color: #9aa8b8; }
  .event-alarm { border-left-color: #ff4d4d; }
  .event-fault { border-left-color: #ffaa00; }
  .event-normal { border-left-color: #00cc88; }
  .event-sys-update { border-left-color: #bb88ff; }
  .event-raw { border-left-color: #3a5a6a; }
  .empty { text-align: center; color: #4a5a6a; padding: 40px; font-size: 13px; }
  .badge { background: #2a3a4a; color: #7a8a9a; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; }
  @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .flash { animation: flash 0.6s ease-in-out; }
  .device-row-selected td { background: #1e3040 !important; border-left: 2px solid #00d4ff; }
</style>
</head>
<body>
<header>
  <h1>🖥️ YongChuanTools</h1>
  <span class="subtitle">GB26875 消防协议 · 实时监控</span>
  <span id="connStatus" style="margin-left:auto;color:#7a8a9a;font-size:12px;">● 连接中</span>
</header>

<div class="status-bar">
  <div class="stat">
    <span class="stat-label">连接会话</span>
    <span class="stat-value" id="stat-sessions">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">总消息</span>
    <span class="stat-value" id="stat-messages">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">设备数量</span>
    <span class="stat-value" id="stat-equipment">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">最新设备</span>
    <span class="stat-value success" id="stat-latest" style="font-size:14px;">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">最新状态</span>
    <span id="stat-latest-state" style="font-size:14px;">—</span>
  </div>
</div>

<div class="main">
  <!-- 事件流 -->
  <div class="panel">
    <div class="panel-header">📡 实时事件流 <span class="badge" id="event-count">0</span><span id="event-filter-badge" style="display:none;color:#ffaa00;font-size:11px;"></span></div>
    <div class="panel-body">
      <div class="event-list" id="event-list">
        <div class="empty">等待数据上报...</div>
      </div>
    </div>
  </div>

  <!-- 设备列表 -->
  <div class="panel">
    <div class="panel-header">📋 设备列表 <span class="badge" id="device-count">0</span></div>
    <div class="panel-body">
      <table id="device-table">
        <thead>
          <tr>
            <th>设备地址</th>
            <th>类型</th>
            <th>状态</th>
            <th>更新时间</th>
          </tr>
        </thead>
        <tbody id="device-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<script>
const MAX_EVENTS = 100;
let events = [];
let devices = {};
let totalMessages = 0;
let connection = null;
let selectedDeviceKey = null; // null = show all

function formatTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}`;
}

function getStateTag(state) {
  if (state === 0) return '<span class="tag tag-normal">正常</span>';
  if (state === 1) return '<span class="tag tag-alarm">报警</span>';
  if (state === 2) return '<span class="tag tag-fault">故障</span>';
  if (state === 3) return '<span class="tag tag-shield">屏蔽</span>';
  return `<span class="tag tag-unknown">未知(${state})</span>`;
}

function addEvent(e) {
  events.unshift(e);
  if (events.length > MAX_EVENTS) events.pop();
  renderEvents();
  document.getElementById('event-count').textContent = events.length;
}

function renderEvents() {
  const el = document.getElementById('event-list');
  // Filter by selected device
  const visible = selectedDeviceKey
    ? events.filter(e => {
        const key = e.Address || e.equipAddr || e.address || '';
        return key === selectedDeviceKey;
      })
    : events;

  if (visible.length === 0) {
    el.innerHTML = selectedDeviceKey
      ? `<div class="empty">该设备暂无事件</div>`
      : `<div class="empty">等待数据上报...</div>`;
    return;
  }
  el.innerHTML = visible.map(e => {
    const stateVal = e.equipState ?? e.sysState ?? 0;
    const stateClass = stateVal === 1 ? 'event-alarm' : stateVal === 2 ? 'event-fault' : stateVal === 0 ? 'event-normal' : '';
    const isSys = !!e.isSystem;
    const icon = isSys ? '🏠' : '📟';
    const typeLabel = isSys ? '系统' : '部件';
    const addrLabel = isSys ? `${e.sysTypeName || ''}[${e.sysAddr || ''}]` : (e.equipAddr || e.FormattedAddress || e.formattedAddress || e.Address || e.address || '');
    const rawHex = e.rawHex || e.hex || '';
    const remoteEp = e.remoteEndpoint || '';
    const rawHexRow = rawHex ? `<div class="event-raw" style="margin-top:4px;color:#4a6a7a;font-size:11px;word-break:break-all;">${rawHex}</div>` : '';
    return `<div class="event ${stateClass}">
      <div class="event-time">${formatTime(new Date(e.timestamp))} ${icon} ${typeLabel}</div>
      <div class="event-equip">${addrLabel}</div>
      <div class="event-detail">${e.sysTypeName || ''} / ${e.equipTypeName || ''} 状态:${e.stateName || ''}</div>
      <div class="event-session">${remoteEp ? '📍 ' + remoteEp + ' · ' : ''}会话: ${e.sessionId || '?'}</div>
      ${rawHexRow}
    </div>`;
  }).join('');
}

function toggleDevice(key) {
  if (selectedDeviceKey === key) {
    selectedDeviceKey = null; // deselect
  } else {
    selectedDeviceKey = key;
  }
  renderEvents();
  updateDeviceList(); // refresh selected state
  // Update panel header filter indicator
  const badge = document.getElementById('event-filter-badge');
  if (selectedDeviceKey) {
    badge.textContent = ' | 筛选: ' + selectedDeviceKey;
    badge.style.display = 'inline';
  } else {
    badge.textContent = '';
    badge.style.display = 'none';
  }
}

function updateDeviceList() {
  const list = Object.values(devices).slice(-100).reverse();
  document.getElementById('device-count').textContent = Object.keys(devices).length;
  document.getElementById('device-tbody').innerHTML = list.map(d => {
    const key = d.Address || d.equipAddr || d.address || '';
    const isSelected = key === selectedDeviceKey;
    const t = new Date(d.lastUpdate);
    const remoteEp = d.RemoteEndpoint || '';
    return `<tr class="device-row ${isSelected ? 'device-row-selected' : ''}" onclick="toggleDevice('${key.replace(/'/g,"\\'")}')" style="cursor:pointer" title="点击过滤/取消过滤">
      <td style="font-family:monospace;font-size:12px;">${d.equipAddr || d.FormattedAddress || d.formattedAddress || d.Address || d.address || '—'}</td>
      <td>${d.equipTypeName || d.sysTypeName || '?'}</td>
      <td>${getStateTag(d.equipState || d.sysState || 0)}</td>
      <td style="color:#7a8a9a;font-size:11px;">${formatTime(t)}</td>
    </tr>`;
  }).join('');
}

function updateStats(data) {
  document.getElementById('stat-sessions').textContent = data.connectedSessions || 0;
  document.getElementById('stat-messages').textContent = data.totalMessages || 0;
  document.getElementById('stat-equipment').textContent = data.equipmentCount || 0;

  // Latest device from live devices dict
  const devs = Object.values(devices);
  if (devs.length > 0) {
    const latest = devs[devs.length - 1];
    document.getElementById('stat-latest').textContent = latest.Address || latest.equipAddr || latest.address || latest.formattedAddress || '?';
    document.getElementById('stat-latest-state').innerHTML = getStateTag(latest.equipState || latest.sysState || 0);
  }
}

// Connect to SignalR
function connect() {
  connection = new signalR.HubConnectionBuilder()
    .withUrl("/dashboard")
    .withAutomaticReconnect([0, 1000, 5000, 10000, 30000])
    .configureLogging(signalR.LogLevel.Warning)
    .build();

  connection.on("ReceiveEquipUpdate", function(data) {
    totalMessages++;
    devices[data.equipAddr] = data;
    updateDeviceList();
    updateStats({ connectedSessions: document.getElementById('stat-sessions').textContent * 1, totalMessages, equipmentCount: Object.keys(devices).length });
    addEvent({ ...data, timestamp: new Date().toISOString() });
  });

  connection.on("ReceiveSysUpdate", function(data) {
    totalMessages++;
    updateStats({ connectedSessions: document.getElementById('stat-sessions').textContent * 1, totalMessages, equipmentCount: Object.keys(devices).length });
    addEvent({ ...data, isSystem: true, timestamp: new Date().toISOString() });
  });

  connection.on("ReceiveRawMessage", function(data) {
    addEvent({
      isRaw: true,
      timestamp: new Date(data.timestamp).toISOString(),
      sessionId: data.remoteEndpoint || '?',
      rawHex: data.hex || '',
      stateName: '原始报文'
    });
  });

  connection.onreconnecting(() => {
    document.getElementById('connStatus').textContent = '● 重连中...';
    document.getElementById('connStatus').style.color = '#ffaa00';
  });

  connection.onreconnected(() => {
    document.getElementById('connStatus').textContent = '● 已连接';
    document.getElementById('connStatus').style.color = '#00cc88';
    // Refresh full state
    connection.invoke("GetSnapshot").then(updateFromSnapshot).catch(() => {});
  });

  connection.onclose(() => {
    document.getElementById('connStatus').textContent = '● 已断开';
    document.getElementById('connStatus').style.color = '#ff4d4d';
  });

  connection.start()
    .then(() => {
      document.getElementById('connStatus').textContent = '● 已连接';
      document.getElementById('connStatus').style.color = '#00cc88';
      return connection.invoke("GetSnapshot");
    })
    .then(updateFromSnapshot)
    .catch(err => {
      console.error("SignalR错误:", err);
      document.getElementById('connStatus').textContent = '● 连接失败';
      document.getElementById('connStatus').style.color = '#ff4d4d';
    });
}

function updateFromSnapshot(snap) {
  if (!snap) return;
  // Restore devices
  devices = {};
  if (snap.equipment) {
    snap.equipment.forEach(e => {
      const key = e.Address || e.equipAddr || e.address;
      devices[key] = e;
      // Add snapshot equipment as historical events
      addEvent({ ...e, timestamp: new Date(e.lastUpdate || Date.now()).toISOString() });
    });
  }
  if (snap.systems) {
    snap.systems.forEach(s => {
      addEvent({ ...s, isSystem: true, timestamp: new Date(s.timestamp || Date.now()).toISOString() });
    });
  }
  updateDeviceList();
  updateStats(snap);
}

// Init
connect();

// Poll health as fallback
setInterval(async () => {
  try {
    const r = await fetch('/api/health');
    if (r.ok) {
      const d = await fetch('/api/snapshot').then(r => r.json()).catch(() => null);
      if (d) updateFromSnapshot(d);
    }
  } catch(e) {}
}, 5000);
</script>
</body>
</html>
