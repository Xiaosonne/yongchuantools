<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YongChuanTools 仪表盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #0f1923; color: #e0e0e0; min-height: 100vh; }
  header { background: #1a2533; padding: 16px 24px; border-bottom: 1px solid #2a3a4a; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; color: #00d4ff; }
  header .subtitle { color: #7a8a9a; font-size: 13px; }
  .status-bar { display: flex; gap: 24px; padding: 16px 24px; background: #1a2533; border-bottom: 1px solid #2a3a4a; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 11px; color: #7a8a9a; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: 600; color: #00d4ff; }
  .stat-value.warning { color: #ffaa00; }
  .stat-value.danger { color: #ff4d4d; }
  .stat-value.success { color: #00cc88; }
  .main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px 24px; height: calc(100vh - 168px); }
  .panel { background: #1a2533; border-radius: 8px; border: 1px solid #2a3a4a; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid #2a3a4a; font-size: 13px; font-weight: 600; color: #7a8a9a; display: flex; align-items: center; gap: 8px; }
  .panel-body { flex: 1; overflow-y: auto; padding: 8px; }
  .panel-body::-webkit-scrollbar { width: 6px; }
  .panel-body::-webkit-scrollbar-thumb { background: #3a4a5a; border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px; color: #7a8a9a; font-weight: 500; border-bottom: 1px solid #2a3a4a; position: sticky; top: 0; background: #1a2533; }
  td { padding: 8px; border-bottom: 1px solid #1e2a38; }
  tr:hover td { background: #1e2a38; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .tag-normal { background: #0d3320; color: #00cc88; }
  .tag-alarm { background: #330d0d; color: #ff4d4d; }
  .tag-fault { background: #332800; color: #ffaa00; }
  .tag-shield { background: #1a1a33; color: #8888ff; }
  .tag-unknown { background: #1a1a1a; color: #7a8a9a; }
  .event-list { display: flex; flex-direction: column; gap: 6px; }
  .event { padding: 10px 12px; background: #1e2a38; border-radius: 6px; border-left: 3px solid #2a3a4a; font-size: 12px; }
  .event-time { color: #7a8a9a; font-size: 11px; margin-bottom: 3px; }
  .event-equip { color: #00d4ff; font-weight: 500; }
  .event-sys { color: #bb88ff; }
  .event-session { color: #7a8a9a; font-size: 11px; }
  .event-detail { margin-top: 4px; color: #9aa8b8; }
  .event-alarm { border-left-color: #ff4d4d; }
  .event-fault { border-left-color: #ffaa00; }
  .event-normal { border-left-color: #00cc88; }
  .event-sys-update { border-left-color: #bb88ff; }
  .event-raw { border-left-color: #3a5a6a; }
  .empty { text-align: center; color: #4a5a6a; padding: 40px; font-size: 13px; }
  .badge { background: #2a3a4a; color: #7a8a9a; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; }
  @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  .flash { animation: flash 0.6s ease-in-out; }
  .device-row-selected td { background: #1e3040 !important; border-left: 2px solid #00d4ff; }

  /* ── Hex Input ── */
  .hex-input-bar { display: flex; gap: 8px; align-items: center; padding: 10px 24px; background: #1a2533; border-bottom: 1px solid #2a3a4a; }
  .hex-input-bar input { flex: 1; padding: 6px 10px; background: #0f1923; border: 1px solid #2a3a4a; border-radius: 4px; color: #00d4ff; font-family: monospace; font-size: 12px; outline: none; }
  .hex-input-bar input:focus { border-color: #00d4ff; }
  .hex-input-bar button { padding: 6px 16px; background: #00d4ff; border: none; border-radius: 4px; color: #0f1923; font-weight: 600; font-size: 12px; cursor: pointer; }
  .hex-input-bar button:hover { background: #00bce0; }
  .hex-input-bar label { color: #7a8a9a; font-size: 12px; align-self: center; }

  /* ── Decode Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.hidden { display: none; }
  .modal { background: #1a2533; border: 1px solid #2a3a4a; border-radius: 10px; width: 680px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-header { padding: 14px 18px; border-bottom: 1px solid #2a3a4a; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; color: #00d4ff; }
  .modal-header .modal-close { background: none; border: none; color: #7a8a9a; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .modal-header .modal-close:hover { color: #e0e0e0; }
  .modal-body { overflow-y: auto; padding: 14px 18px; font-size: 12px; }
  .modal-raw-hex { background: #0f1923; border: 1px solid #2a3a4a; border-radius: 4px; padding: 10px 12px; font-family: 'Courier New', monospace; font-size: 11px; color: #4a8a9a; word-break: break-all; margin-bottom: 14px; line-height: 1.6; }
  .modal-section { margin-bottom: 12px; }
  .modal-section-title { color: #7a8a9a; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 0; border-bottom: 1px solid #2a3a4a; margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; }
  .modal-section-title:hover { color: #00d4ff; }
  .modal-section-title .toggle { font-size: 10px; }
  .modal-field { display: flex; gap: 0; line-height: 1.7; }
  .modal-field-name { color: #7a8a9a; min-width: 120px; padding: 1px 8px 1px 0; }
  .modal-field-bytes { color: #4a7a9a; font-family: monospace; min-width: 160px; padding: 1px 8px; border-right: 1px solid #2a3a4a; }
  .modal-field-value { color: #00d4ff; padding: 1px 8px; font-family: monospace; }
  .modal-field-desc { color: #5a6a7a; padding: 1px 8px; font-size: 11px; }
  .modal-bits { margin-top: 6px; }
  .modal-bits table { width: auto; font-size: 11px; border: 1px solid #2a3a4a; border-radius: 4px; }
  .modal-bits th { background: #0f1923; color: #7a8a9a; padding: 3px 8px; }
  .modal-bits td { padding: 2px 8px; border-top: 1px solid #1e2a38; }
  .modal-bits td.bit-active { color: #00cc88; font-weight: 600; }
  .modal-bits td.bit-inactive { color: #3a4a5a; }
  .modal-error { color: #ff4d4d; padding: 20px; text-align: center; }
  .event-row { cursor: pointer; }
  .event-row:hover { filter: brightness(1.15); }
  .decode-status { font-size: 11px; color: #7a8a9a; align-self: center; }
  .section-content { padding-left: 4px; }
</style>
</head>
<body>
<header>
  <h1>🖥️ YongChuanTools</h1>
  <span class="subtitle">GB26875 消防协议 · 实时监控</span>
  <span id="connStatus" style="margin-left:auto;color:#7a8a9a;font-size:12px;">● 连接中</span>
</header>

<div class="status-bar">
  <div class="stat">
    <span class="stat-label">连接会话</span>
    <span class="stat-value" id="stat-sessions">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">总消息</span>
    <span class="stat-value" id="stat-messages">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">设备数量</span>
    <span class="stat-value" id="stat-equipment">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">最新设备</span>
    <span class="stat-value success" id="stat-latest" style="font-size:14px;">—</span>
  </div>
  <div class="stat">
    <span class="stat-label">最新状态</span>
    <span id="stat-latest-state" style="font-size:14px;">—</span>
  </div>
</div>

<div class="hex-input-bar">
  <label>🔧 报文解析：</label>
  <input id="hex-input" type="text" placeholder="粘贴完整报文 HEX（支持 0x5555 或 0x4040 起始码）" onkeydown="if(event.key==='Enter') decodeHexInput()" />
  <button onclick="decodeHexInput()">解析</button>
  <span class="decode-status" id="decode-status"></span>
</div>

<div class="main">
  <!-- 事件流 -->
  <div class="panel">
    <div class="panel-header">📡 实时事件流 <span class="badge" id="event-count">0</span><span id="event-filter-badge" style="display:none;color:#ffaa00;font-size:11px;"></span></div>
    <div class="panel-body">
      <div class="event-list" id="event-list">
        <div class="empty">等待数据上报...</div>
      </div>
    </div>
  </div>

  <!-- 设备列表 -->
  <div class="panel">
    <div class="panel-header">📋 设备列表 <span class="badge" id="device-count">0</span></div>
    <div class="panel-body">
      <table id="device-table">
        <thead>
          <tr>
            <th>设备地址</th>
            <th>类型</th>
            <th>状态</th>
            <th>更新时间</th>
          </tr>
        </thead>
        <tbody id="device-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 解码详情 Modal -->
<div class="modal-overlay hidden" id="decode-modal">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">📋 报文解析</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<script>
const MAX_EVENTS = 100;
let events = [];
let devices = {};
let totalMessages = 0;
let connection = null;
let selectedDeviceKey = null; // null = show all

function formatTime(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}`;
}

function getStateTag(state) {
  if (state === 0) return '<span class="tag tag-normal">正常</span>';
  if (state === 1) return '<span class="tag tag-alarm">报警</span>';
  if (state === 2) return '<span class="tag tag-fault">故障</span>';
  if (state === 3) return '<span class="tag tag-shield">屏蔽</span>';
  return `<span class="tag tag-unknown">未知(${state})</span>`;
}

function addEvent(e) {
  events.unshift(e);
  if (events.length > MAX_EVENTS) events.pop();
  renderEvents();
  document.getElementById('event-count').textContent = events.length;
}

function renderEvents() {
  const el = document.getElementById('event-list');
  // Filter by selected device
  const visible = selectedDeviceKey
    ? events.filter(e => {
        const key = e.Address || e.equipAddr || e.address || '';
        return key === selectedDeviceKey;
      })
    : events;

  if (visible.length === 0) {
    el.innerHTML = selectedDeviceKey
      ? `<div class="empty">该设备暂无事件</div>`
      : `<div class="empty">等待数据上报...</div>`;
    return;
  }
  el.innerHTML = visible.map((e, idx) => {
    const stateVal = e.equipState ?? e.sysState ?? 0;
    const stateClass = stateVal === 1 ? 'event-alarm' : stateVal === 2 ? 'event-fault' : stateVal === 0 ? 'event-normal' : '';
    const isSys = !!e.isSystem;
    const icon = isSys ? '🏠' : '📟';
    const typeLabel = isSys ? '系统' : '部件';
    const addrLabel = isSys ? `${e.sysTypeName || ''}[${e.sysAddr || ''}]` : (e.equipAddr || e.FormattedAddress || e.formattedAddress || e.Address || e.address || '');
    const rawHex = e.rawHex || e.hex || '';
    const remoteEp = e.remoteEndpoint || '';
    const rawHexRow = rawHex ? `<div class="event-raw" style="margin-top:4px;color:#4a6a7a;font-size:11px;word-break:break-all;">${rawHex}</div>` : '';
    return `<div class="event ${stateClass} event-row" onclick="openDecodeModal('${(rawHex || '').replace(/'/g, "\\'")}', ${idx})">
      <div class="event-time">${formatTime(new Date(e.timestamp))} ${icon} ${typeLabel}</div>
      <div class="event-equip">${addrLabel}</div>
      <div class="event-detail">${e.sysTypeName || ''} / ${e.equipTypeName || ''} 状态:${e.stateName || ''}</div>
      <div class="event-session">${remoteEp ? '📍 ' + remoteEp + ' · ' : ''}会话: ${e.sessionId || '?'}</div>
      ${rawHexRow}
    </div>`;
  }).join('');
}

function toggleDevice(key) {
  if (selectedDeviceKey === key) {
    selectedDeviceKey = null; // deselect
  } else {
    selectedDeviceKey = key;
  }
  renderEvents();
  updateDeviceList(); // refresh selected state
  // Update panel header filter indicator
  const badge = document.getElementById('event-filter-badge');
  if (selectedDeviceKey) {
    badge.textContent = ' | 筛选: ' + selectedDeviceKey;
    badge.style.display = 'inline';
  } else {
    badge.textContent = '';
    badge.style.display = 'none';
  }
}

function updateDeviceList() {
  const list = Object.values(devices).slice(-100).reverse();
  document.getElementById('device-count').textContent = Object.keys(devices).length;
  document.getElementById('device-tbody').innerHTML = list.map(d => {
    const key = d.Address || d.equipAddr || d.address || '';
    const isSelected = key === selectedDeviceKey;
    const t = new Date(d.lastUpdate);
    const remoteEp = d.RemoteEndpoint || '';
    return `<tr class="device-row ${isSelected ? 'device-row-selected' : ''}" onclick="toggleDevice('${key.replace(/'/g,"\\'")}')" style="cursor:pointer" title="点击过滤/取消过滤">
      <td style="font-family:monospace;font-size:12px;">${d.equipAddr || d.FormattedAddress || d.formattedAddress || d.Address || d.address || '—'}</td>
      <td>${d.equipTypeName || d.sysTypeName || '?'}</td>
      <td>${getStateTag(d.equipState || d.sysState || 0)}</td>
      <td style="color:#7a8a9a;font-size:11px;">${formatTime(t)}</td>
    </tr>`;
  }).join('');
}

function updateStats(data) {
  document.getElementById('stat-sessions').textContent = data.connectedSessions || 0;
  document.getElementById('stat-messages').textContent = data.totalMessages || 0;
  document.getElementById('stat-equipment').textContent = data.equipmentCount || 0;

  // Latest device from live devices dict
  const devs = Object.values(devices);
  if (devs.length > 0) {
    const latest = devs[devs.length - 1];
    document.getElementById('stat-latest').textContent = latest.Address || latest.equipAddr || latest.address || latest.formattedAddress || '?';
    document.getElementById('stat-latest-state').innerHTML = getStateTag(latest.equipState || latest.sysState || 0);
  }
}

// Connect to SignalR
function connect() {
  connection = new signalR.HubConnectionBuilder()
    .withUrl("/dashboard")
    .withAutomaticReconnect([0, 1000, 5000, 10000, 30000])
    .configureLogging(signalR.LogLevel.Warning)
    .build();

  connection.on("ReceiveEquipUpdate", function(data) {
    totalMessages++;
    devices[data.equipAddr] = data;
    updateDeviceList();
    updateStats({ connectedSessions: document.getElementById('stat-sessions').textContent * 1, totalMessages, equipmentCount: Object.keys(devices).length });
    addEvent({ ...data, timestamp: new Date().toISOString() });
  });

  connection.on("ReceiveSysUpdate", function(data) {
    totalMessages++;
    updateStats({ connectedSessions: document.getElementById('stat-sessions').textContent * 1, totalMessages, equipmentCount: Object.keys(devices).length });
    addEvent({ ...data, isSystem: true, timestamp: new Date().toISOString() });
  });

  connection.on("ReceiveRawMessage", function(data) {
    addEvent({
      isRaw: true,
      timestamp: new Date(data.timestamp).toISOString(),
      sessionId: data.remoteEndpoint || '?',
      rawHex: data.hex || '',
      stateName: '原始报文'
    });
  });

  connection.onreconnecting(() => {
    document.getElementById('connStatus').textContent = '● 重连中...';
    document.getElementById('connStatus').style.color = '#ffaa00';
  });

  connection.onreconnected(() => {
    document.getElementById('connStatus').textContent = '● 已连接';
    document.getElementById('connStatus').style.color = '#00cc88';
    // Refresh full state
    connection.invoke("GetSnapshot").then(updateFromSnapshot).catch(() => {});
  });

  connection.onclose(() => {
    document.getElementById('connStatus').textContent = '● 已断开';
    document.getElementById('connStatus').style.color = '#ff4d4d';
  });

  connection.start()
    .then(() => {
      document.getElementById('connStatus').textContent = '● 已连接';
      document.getElementById('connStatus').style.color = '#00cc88';
      return connection.invoke("GetSnapshot");
    })
    .then(updateFromSnapshot)
    .catch(err => {
      console.error("SignalR错误:", err);
      document.getElementById('connStatus').textContent = '● 连接失败';
      document.getElementById('connStatus').style.color = '#ff4d4d';
    });
}

function updateFromSnapshot(snap) {
  if (!snap) return;
  // Restore devices
  devices = {};
  if (snap.equipment) {
    snap.equipment.forEach(e => {
      const key = e.Address || e.equipAddr || e.address;
      devices[key] = e;
      // Add snapshot equipment as historical events
      addEvent({ ...e, timestamp: new Date(e.lastUpdate || Date.now()).toISOString() });
    });
  }
  if (snap.systems) {
    snap.systems.forEach(s => {
      addEvent({ ...s, isSystem: true, timestamp: new Date(s.timestamp || Date.now()).toISOString() });
    });
  }
  updateDeviceList();
  updateStats(snap);
}

// ── Modal Functions ──
function closeModal() {
  document.getElementById('decode-modal').classList.add('hidden');
}

function openDecodeModal(rawHex, eventIdx) {
  if (!rawHex || rawHex.length < 10) return;
  document.getElementById('modal-title').textContent = '📋 报文解析';
  document.getElementById('modal-body').innerHTML = '<div style="padding:20px;text-align:center;color:#7a8a9a;">⏳ 解析中...</div>';
  document.getElementById('decode-modal').classList.remove('hidden');

  fetch('/api/decode', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ hex: rawHex })
  })
  .then(r => r.json())
  .then(data => {
    if (!data.valid) {
      document.getElementById('modal-body').innerHTML = `<div class="modal-error">解析失败: ${data.error || 'UNKNOWN'}</div>`;
      return;
    }
    document.getElementById('modal-body').innerHTML = renderProtocolTree(data, rawHex);
    attachSectionToggles();
  })
  .catch(err => {
    document.getElementById('modal-body').innerHTML = `<div class="modal-error">网络错误: ${err.message}</div>`;
  });
}

function renderProtocolTree(data, rawHex) {
  let html = `<div class="modal-raw-hex">${(rawHex || data.rawHex || '')}</div>`;

  // Helper: render a field row
  function field(name, f) {
    if (!f) return '';
    return `<div class="modal-field">
      <span class="modal-field-name">${name}</span>
      <span class="modal-field-bytes">${f.bytes || ''}</span>
      <span class="modal-field-value">${f.value || ''}</span>
      <span class="modal-field-desc">${f.desc || ''}</span>
    </div>`;
  }

  // Header section
  html += `<div class="modal-section">
    <div class="modal-section-title" onclick="toggleSection(this)"><span class="toggle">▸</span> 📦 UTHeader (报文头)</div>
    <div class="section-content">`;
  if (data.start) html += field('start', data.start);
  if (data.length) html += field('length', data.length);
  if (data.seq) html += field('seq', data.seq);
  if (data.time) html += field('time', data.time);
  if (data.srcAddr) html += field('srcAddr', data.srcAddr);
  if (data.dstAddr) html += field('dstAddr', data.dstAddr);
  if (data.cmd) html += field('cmd', data.cmd);
  html += `</div></div>`;

  // AppHeader section
  html += `<div class="modal-section">
    <div class="modal-section-title" onclick="toggleSection(this)"><span class="toggle">▸</span> 📋 UTAppHeader (应用头)</div>
    <div class="section-content">`;
  if (data.appHeaderType) html += field('appType', data.appHeaderType);
  if (data.appHeaderCount) html += field('appCount', data.appHeaderCount);
  html += `</div></div>`;

  // Data section
  if (data.appTypeName && (data.sysState || data.equipState)) {
    const isSys = !!data.sysState;
    const title = isSys ? '📊 UTSysState (系统状态)' : '📟 UTEquipState (设备状态)';
    html += `<div class="modal-section">
      <div class="modal-section-title" onclick="toggleSection(this)"><span class="toggle">▸</span> ${title}</div>
      <div class="section-content">`;
    if (data.sysType) html += field('sysType', data.sysType);
    if (data.sysAddr) html += field('sysAddr', data.sysAddr);
    if (isSys && data.sysState) {
      html += field('sysState', { bytes: data.sysState.bytes, value: data.sysState.value, desc: data.sysState.desc });
      html += renderBitsTable(data.sysState.bits);
    }
    if (!isSys && data.equipType) html += field('equipType', data.equipType);
    if (!isSys && data.equipAddr) html += field('equipAddr', data.equipAddr);
    if (!isSys && data.equipState) {
      html += field('equipState', { bytes: data.equipState.bytes, value: data.equipState.value, desc: data.equipState.desc });
      html += renderBitsTable(data.equipState.bits);
    }
    if (!isSys && data.addrType) html += field('addrType', data.addrType);
    if (!isSys && data.equipDesc) html += field('equipDesc', data.equipDesc);
    if (data.dataTime) html += field('dataTime', data.dataTime);
    if (data.equipTime) html += field('equipTime', data.equipTime);
    html += `</div></div>`;
  }

  // Tail section
  html += `<div class="modal-section">
    <div class="modal-section-title" onclick="toggleSection(this)"><span class="toggle">▸</span> 🔚 UTTail (校验尾)</div>
    <div class="section-content">`;
  if (data.checksum) html += field('checksum', data.checksum);
  if (data.end) html += field('end', data.end);
  if (data.warnings && data.warnings.length > 0) {
    html += `<div style="color:#ffaa00;font-size:11px;padding:4px 0;">⚠ ${data.warnings.join(' · ')}</div>`;
  }
  html += `</div></div>`;

  return html;
}

function renderBitsTable(bits) {
  if (!bits || bits.length === 0) return '';
  let html = `<div class="modal-bits"><table><thead><tr><th>bit</th><th>名称</th><th>值</th><th>说明</th></tr></thead><tbody>`;
  bits.forEach(b => {
    const cls = b.value === 1 ? 'bit-active' : 'bit-inactive';
    html += `<tr><td class="${cls}">${b.bit}</td><td class="${cls}">${b.name || ''}</td><td class="${cls}">${b.value}</td><td class="${cls}">${b.desc || ''}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function toggleSection(el) {
  const content = el.nextElementSibling;
  if (!content) return;
  const isOpen = content.style.display !== 'none';
  content.style.display = isOpen ? 'none' : 'block';
  el.querySelector('.toggle').textContent = isOpen ? '▸' : '▾';
}

function attachSectionToggles() {
  document.querySelectorAll('.modal-section-title').forEach(el => {
    if (!el.querySelector('.toggle')) return;
    el.querySelector('.toggle').textContent = '▸';
  });
}

// ── Hex Input Decode ──
async function decodeHexInput() {
  const input = document.getElementById('hex-input');
  const status = document.getElementById('decode-status');
  const hex = input.value.trim();
  if (!hex) return;
  status.textContent = '解析中...';
  try {
    const r = await fetch('/api/decode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hex })
    });
    const data = await r.json();
    status.textContent = data.valid ? '✓ 解析成功' : '✗ ' + (data.error || '失败');
    status.style.color = data.valid ? '#00cc88' : '#ff4d4d';
    if (data.valid) {
      addEvent({
        isManualDecode: true,
        timestamp: new Date().toISOString(),
        stateName: data.appTypeName || '手动解析',
        rawHex: data.rawHex || hex,
        sessionId: '本地解析',
        sysTypeName: data.sysType?.value || '',
        equipTypeName: data.equipType?.value || '',
        sysState: data.sysState?.value ? 1 : 0,
        equipState: data.equipState?.value ? 1 : 0,
        remoteEndpoint: ''
      });
      input.value = '';
    }
  } catch(e) {
    status.textContent = '✗ 网络错误';
    status.style.color = '#ff4d4d';
  }
  setTimeout(() => { status.textContent = ''; status.style.color = ''; }, 3000);
}

// Init
connect();

// Poll health as fallback
setInterval(async () => {
  try {
    const r = await fetch('/api/health');
    if (r.ok) {
      const d = await fetch('/api/snapshot').then(r => r.json()).catch(() => null);
      if (d) updateFromSnapshot(d);
    }
  } catch(e) {}
}, 5000);
</script>
